profile = "https://sbol.io/spec/sbol-inventory/0.2"
version = "0.2"
status = "draft"

[[rules]]
id = "sbolinv-10001"
section = "Scope"
classes = ["Validator"]
strength = "required"
machine_checkable = true
shacl_core = false
statement = "The document MUST conform to the SBOL 3 version declared by the implementation."

[[rules]]
id = "sbolinv-10002"
section = "Common requirements"
classes = ["Reader", "Writer", "Validator"]
strength = "required"
machine_checkable = true
shacl_core = true
fixture = "fixtures/invalid/sbolinv-10002-wrong-base-type.ttl"
statement = "Facility, Zone, and Asset MUST be SBOL TopLevel objects; CapabilityOffering and PropertyValue MUST be SBOL Identified children; a material lot MUST be an SBOL Implementation."

[[rules]]
id = "sbolinv-10003"
section = "Extension policy"
classes = ["Reader", "Writer"]
strength = "required"
machine_checkable = true
shacl_core = false
fixture = "fixtures/valid/open-extensions.ttl"
statement = "A read-write round trip MUST preserve unknown non-SBOL triples on identified objects unless a caller explicitly requests a lossy projection."

[[rules]]
id = "sbolinv-10004"
section = "Common requirements"
classes = ["Writer", "Validator"]
strength = "required"
machine_checkable = true
shacl_core = true
fixture = "fixtures/invalid/sbolinv-10004-property-range.ttl"
statement = "Every profile property MUST satisfy the maximum cardinality, RDF node kind, and datatype stated by the profile tables."

