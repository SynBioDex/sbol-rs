[[rules]]
id = "sbolinv-18001"
section = "Candidate-query behavior"
classes = ["Query"]
strength = "required"
machine_checkable = true
shacl_core = false
statement = "Query implementations MUST use the closed total qualification order defined by Profile 0.2 and reject unknown qualification values."

[[rules]]
id = "sbolinv-18002"
section = "Candidate-query behavior"
classes = ["Query"]
strength = "required"
machine_checkable = true
shacl_core = false
statement = "A Query implementation MUST reject a non-IRI capability-kind argument, and a candidate MUST satisfy exact capability kind, minimum qualification, facility filter, offering activity, and effective asset activity."

[[rules]]
id = "sbolinv-18003"
section = "Candidate-query behavior"
classes = ["Query"]
strength = "required"
machine_checkable = true
shacl_core = false
statement = "Candidate-query results MUST be ordered lexicographically by Asset IRI."
