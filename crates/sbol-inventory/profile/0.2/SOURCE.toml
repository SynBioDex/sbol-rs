id = "core-compatible-material-lineage"
description = "Use fac:derivedFromMaterial instead of prov:wasDerivedFrom between Implementations, because SBOL 3 rules sbol3-12301 and sbol3-12302 reserve an Implementation's prov:wasDerivedFrom values for Components."

