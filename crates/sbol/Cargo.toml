[package]
name = "sbol"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "The sbol-rs SDK for SBOL 2, SBOL 3, and bidirectional conversion."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sbol"
license.workspace = true
readme = "../../README.md"
keywords = ["sbol", "synthetic-biology", "rdf"]
categories = ["science", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
sbol-core.workspace = true
sbol-rdf.workspace = true
sbol2.workspace = true
sbol3.workspace = true
sbol-convert.workspace = true
