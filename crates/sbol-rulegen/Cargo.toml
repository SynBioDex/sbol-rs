[package]
name = "sbol-rulegen"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Build-time code generator for SBOL core and extension-profile validation rule catalogs."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sbol-rulegen"
license.workspace = true
readme = "README.md"
keywords = ["sbol", "validation", "codegen", "synthetic-biology"]
categories = ["development-tools::build-utils"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
